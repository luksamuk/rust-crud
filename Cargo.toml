[package]
name = "registry"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
diesel = { version = "2.2.0", features = ["postgres", "uuid", "chrono", "extras", "numeric"] }
diesel-async = { version = "0.7.3", features = ["postgres", "deadpool"] }
deadpool = "0.12.3"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde_repr = "0.1"
dotenvy = "0.15"
argon2 = "0.5.3"
rocket_anyhow = "0.2"
paginator-rocket = "0.2.0"
anyhow = "1.0.100"
thiserror = "2.0.17"


